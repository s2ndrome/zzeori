<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--ARTIFACT-START-->
<title>R♡M</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 그래픽 툴 화면 같은 한 장짜리 페이지.
   위: 메뉴 바 → 기본 룩북 세팅(남캐·여캐, 제복 단락 포함) 텍스트 박스 두 개 + 큰 PROMPT 타이포
   가운데: 캐릭터 섹션 버튼(신드롬 / 리아)
   아래: 선택한 캐릭터의 의상 그리드 → 누르면 프롬프트 팝업
   흑백 톤의 단일 밝은 테마. 의상 이미지는 원본 색 그대로, 잘리지 않게 전체를 보여준다. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111111; --ink2:#3b3b3b; --mute:#7a7a7a; --line:#111111; --soft:#f1f1ef; --err:#a12a2a;
  --grot:"Archivo","Helvetica Neue",Arial,"Noto Sans KR",sans-serif;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Noto Sans KR",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--grot);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;position:relative}

/* 핸들 */
.h{position:absolute;width:11px;height:11px;background:var(--bg);border:1px solid var(--line);pointer-events:none}
.h.tl{top:-6px;left:-6px}.h.tr{top:-6px;right:-6px}.h.bl{bottom:-6px;left:-6px}.h.br{bottom:-6px;right:-6px}.h.tm{top:-6px;left:calc(50% - 6px)}.h.bm{bottom:-6px;left:calc(50% - 6px)}

/* 메뉴 바 */
.menu{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;padding-block:20px 0}
.menu ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
.menu li.on{background:var(--ink);color:var(--bg);padding:0 4px}
.mb{border:0;background:none;padding:0 4px;font:inherit;line-height:inherit}
.mb:hover{text-decoration:underline;text-underline-offset:3px}
.mb[aria-pressed="true"]{background:var(--ink);color:var(--bg);text-decoration:none}
/* view = 완성 화면: 수정·추가·삭제 버튼을 모두 숨긴다 */
.mode-view [data-edit],.mode-view [data-editi],.mode-view [data-add],.mode-view [data-del],.mode-view .ed,.mode-view .mv{display:none!important}
.mode-view .pick[data-portrait]{pointer-events:none}
.mode-view .pick[data-portrait] .empty2{visibility:hidden}
.bars{display:flex;gap:8px;align-items:center}
.bars i{display:block;height:18px;border:1px solid var(--line)}
.bars i.f{background:var(--ink)}
.bars button{border:1px solid var(--line);background:var(--bg);height:22px;padding:0 10px;font-size:12px}

.rot{writing-mode:vertical-rl;font-size:13px;position:absolute;left:-28px;top:220px}

/* 히어로 */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:36px;align-items:start}
.mains{display:flex;flex-direction:column;gap:34px}
.doc{display:flex;flex-direction:column}
.tab{display:inline-flex;align-self:flex-start;align-items:center;gap:14px;border:1px solid var(--line);border-bottom:0;padding:6px 10px;font-size:14px;background:var(--bg)}
.tab b{font-weight:600}
.tab span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.sel{position:relative;border:1px solid var(--line);padding:20px 22px}
.prompt{font-family:var(--mono);font-size:14px;line-height:1.75;margin:0;word-break:break-word;white-space:pre-wrap}
.tb{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:13px}
.tb .box{border:1px solid var(--line);padding:5px 10px}
.btn{border:1px solid var(--line);background:var(--ink);color:var(--bg);padding:7px 14px;font-size:13px}
.btn.w{background:var(--bg);color:var(--ink)}

.side{display:flex;flex-direction:column;gap:22px}
.big{font-weight:400;font-stretch:88%;font-size:clamp(72px,12vw,150px);line-height:.86;letter-spacing:-.04em;margin:0}
.big .o{position:relative;display:inline-block}
.big .o::after{content:"";position:absolute;inset:6% -2% 4%;pointer-events:none;background:
  linear-gradient(var(--ink),var(--ink)) 0 0/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 0/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 100%/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 100%/8px 8px no-repeat}
/* 캐릭터 대표 이미지 */
.portraits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;max-width:440px}
.pt{position:relative;min-width:0}
.pt .pick{display:block;width:100%;border:0;background:none;padding:0;text-align:left;position:relative}
.pt .frame{aspect-ratio:2/3;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden}
.pt .frame img{width:100%;height:100%;object-fit:contain}
.pt .frame .empty2{font-family:var(--kr);font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
.pt .frame .empty2 b{display:block;font-size:30px;font-weight:300;color:var(--ink);line-height:1}
.pt .h{display:none}
.pt .pick:hover .h,.pt .pick:focus-visible .h,.pt.on .h{display:block}
.pt .pick:focus-visible{outline:none}
.pt .cap{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:8px}
.pt .cap b{font-size:15px;font-weight:600;font-family:var(--kr)}
.pt .cap span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.pt .ed{position:absolute;top:6px;right:6px;z-index:2;border:1px solid var(--line);background:var(--bg);font-size:11px;padding:3px 7px;font-family:var(--kr)}
.pt .ed:hover,.pt .ed:focus-visible{background:var(--ink);color:var(--bg)}

/* 섹션 버튼: 신드롬 / 리아 */
.chars{margin-top:64px;display:flex;align-items:center;gap:clamp(12px,3vw,28px);flex-wrap:wrap}
.chars .lbl{font-family:var(--mono);font-size:12px;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg)}
.cbtn{position:relative;border:1px solid transparent;background:none;padding:5px 14px 6px;font-weight:500;font-stretch:80%;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.03em;color:#b5b5b5;font-family:var(--grot)}
.cbtn:hover{color:var(--ink)}
.cbtn[aria-selected="true"]{color:var(--ink);border-color:var(--line)}
.cbtn .h{display:none}
.cbtn[aria-selected="true"] .h{display:block}
.cbtn sup{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;vertical-align:top;margin-left:6px;color:var(--mute)}
.slash{font-weight:300;font-stretch:80%;font-size:clamp(22px,3vw,30px);line-height:1;color:var(--ink)}

/* 의상 그리드 */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 18px;margin-top:30px}
.card{position:relative;min-width:0}
.card .ed{position:absolute;top:6px;right:6px;z-index:2;border:1px solid var(--line);background:var(--bg);font-size:11px;padding:3px 7px;font-family:var(--kr);opacity:.85}
.card .ed:hover,.card .ed:focus-visible{opacity:1;background:var(--ink);color:var(--bg)}
.card .mv{position:absolute;top:6px;left:6px;z-index:2;display:flex}
.card .mv button{border:1px solid var(--line);background:var(--bg);font-size:11px;width:24px;height:22px;padding:0;line-height:1}
.card .mv button+button{border-left:0}
.card .mv button:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.card .mv button:disabled{opacity:.3;cursor:default}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.35}
.card.drop-l::before,.card.drop-r::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--ink);z-index:3}
.card.drop-l::before{left:-11px}.card.drop-r::before{right:-11px}
.mode-view .card[draggable="true"]{cursor:default}
.it{width:100%}
.it{border:0;background:none;padding:0;text-align:left;position:relative;font-family:var(--grot)}
.it .h{display:none}
.it:hover .h,.it:focus-visible .h{display:block}
.it:focus-visible{outline:none}
.art{aspect-ratio:2/3;border:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain}
img.ld{opacity:0}
img{transition:opacity .2s}
.loading{background:linear-gradient(100deg,#f4f4f2 30%,#e9e9e6 50%,#f4f4f2 70%) 0 0/300% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.art.contain img{padding:10%}
.it .nm{display:flex;flex-direction:column;gap:2px;font-size:13px;margin-top:8px;line-height:1.35;word-break:keep-all}
.it .nm em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.addt{border:1px dashed var(--line);background:var(--bg);aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}
.addt b{font-size:42px;font-weight:300;line-height:1}
.empty{grid-column:1/-1;border:1px dashed var(--line);padding:40px 20px;text-align:center;font-size:14px;color:var(--ink2)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:56px;gap:12px;flex-wrap:wrap}
.dots{font-size:22px;letter-spacing:4px}

@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.rot{display:none}.side{flex-direction:row;align-items:flex-end;flex-wrap:wrap}}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.menu ul{gap:14px}.grid{gap:18px 14px}}

/* 팝업 */
.ov{position:fixed;inset:0;z-index:40;background:rgba(17,17,17,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:min(860px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);position:relative;box-shadow:8px 8px 0 var(--ink)}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 8px 8px 14px;font-size:13px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet .bar span{font-family:var(--mono);font-size:12px}
.sheet .x{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1}
.view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.view .art{aspect-ratio:2/3;border:0;border-right:1px solid var(--line)}
.view .bd{padding:24px 22px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.view .tg{font-family:var(--mono);font-size:11px;border:1px solid var(--line);align-self:flex-start;padding:2px 8px}
.view h3{margin:0;font-size:26px;font-weight:500;font-stretch:88%;letter-spacing:-.01em}
.view pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13.5px;line-height:1.75;border:1px dashed var(--line);padding:14px;max-height:300px;overflow:auto}
.view .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn.del{background:var(--bg);color:var(--err);border-color:var(--err)}
.form{padding:22px;display:flex;flex-direction:column;gap:14px;font-family:var(--kr)}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.form input[type=text],.form textarea,.form select{font:inherit;font-weight:400;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:14px;border-radius:0}
.form textarea{min-height:130px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line)}
.seg label{flex:1;flex-direction:row!important;align-items:center;justify-content:center;padding:9px;cursor:pointer;position:relative}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.drop{border:1px dashed var(--line);padding:14px;display:flex;gap:14px;align-items:center}
.drop .pv{width:72px;height:108px;flex:none;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--mute);overflow:hidden}
.drop .pv img{width:100%;height:100%;object-fit:contain}
.drop.over{background:var(--soft);border-style:solid}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.err{color:var(--err);font-size:13px;min-height:1em;margin:0}
.row-end{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:640px){.view{grid-template-columns:1fr}.view .art{aspect-ratio:auto;height:min(65vh,150vw);border-right:0;border-bottom:1px solid var(--line)}.form .two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:14px;z-index:60;font-family:var(--kr)}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.06)}}

/* 제복 단락 */
.prompt+.prompt{margin-top:14px}
.prompt.u{padding-top:14px;border-top:1px dashed var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.tg2{background:var(--bg);color:var(--ink)}
/* 팝업 안 섹션별 프롬프트 */
.pbox{border:1px solid var(--line);position:relative;padding:14px}
.pbox .prompt{font-size:13.5px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vh b{font-size:15px;font-family:var(--kr)}
.vh .btns{display:flex;gap:6px}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--kr);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{width:16px;height:16px;accent-color:#111;margin:0}
/* 폼: 섹션 행 */
.srows{display:flex;flex-direction:column;gap:12px}
.srow{border:1px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.srow .top2{display:flex;gap:8px;align-items:center}
.srow .top2 input{flex:1;min-width:0}
.srow textarea{min-height:90px}
.srow .rm{border:1px solid var(--line);background:var(--bg);width:34px;height:38px;flex:none}
.addsec{align-self:flex-start}
.lk{display:inline-flex;align-items:center;border:1px solid var(--line);height:22px;padding:0 10px;font-size:12px;text-decoration:none;color:var(--ink)}
.mode{font-family:var(--mono);font-size:11px;color:var(--mute)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gbox{width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.gbox .big{font-size:clamp(72px,18vw,120px)}
.gbox p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2);font-family:var(--kr)}
.gbox code{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);padding:0 4px}
.gform{position:relative;border:1px solid var(--line);padding:6px;display:flex;gap:6px}
.gform input{flex:1;min-width:0;border:0;font-family:var(--mono);font-size:15px;padding:10px;background:transparent}
.gform input:focus{outline:none}
.gform:focus-within{box-shadow:4px 4px 0 var(--ink)}
.gform button{border:0;background:var(--ink);color:var(--bg);padding:0 18px;font-size:14px}
.keep{display:flex;align-items:center;gap:8px;font-size:13px;font-family:var(--kr)}
.keep input{width:15px;height:15px;accent-color:#111;margin:0}
.gerr{color:var(--err);font-size:13px;min-height:1.2em;font-family:var(--kr)}
.demo{align-self:flex-start;border:0;background:none;padding:0;font-size:12px;font-family:var(--mono);color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.boot{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.boot .big{font-size:clamp(64px,14vw,110px)}
.boot .bt{font-family:var(--mono);font-size:12px;color:var(--mute);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button.lk{background:var(--bg);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="gate" id="gate" hidden>
  <div class="gbox">
    <div class="menu" style="padding:0"><ul><li>file</li><li>open</li><li class="on">token</li></ul></div>
    <h1 class="big">R<span class="o">♡</span>M</h1>
    <form class="gform" id="gform" autocomplete="off">
      <i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>
      <label for="gtoken" class="sr">GitHub 토큰</label>
      <input id="gtoken" type="password" placeholder="토큰 입력" spellcheck="false">
      <button type="submit">입장</button>
    </form>
    <label class="keep" for="gkeep"><input type="checkbox" id="gkeep" checked>이 기기에서 기억하기</label>
    <div class="gerr" id="gerr" role="alert"></div>
    <button type="button" class="demo" id="gdemo">예시 화면 둘러보기</button>
  </div>
</div>

<div class="boot" id="boot" hidden><span class="big">R<span class="o">♡</span>M</span><span class="bt">불러오는 중…</span></div>

<div class="wrap" id="app">
  <div class="menu">
    <ul><li>filter</li><li>effect</li><li><button type="button" class="mb" data-mode="view" aria-pressed="false" title="완성 화면 보기">view</button></li><li><button type="button" class="mb" data-mode="window" aria-pressed="true" title="수정 화면">window</button></li></ul>
    <div class="bars"><i class="f" style="width:22px"></i><i style="width:clamp(60px,14vw,150px)"></i><button type="button" data-add>+ 추가</button><button type="button" class="lk" id="lock" hidden>나가기</button></div>
  </div>
  <span class="rot">( prompt )</span>

  <div class="hero">
    <div class="mains" id="mains"></div>
    <div class="side">
      <h1 class="big">R<span class="o">♡</span>M</h1>
      <div class="portraits" id="portraits"></div>
    </div>
  </div>

  <div class="chars" role="tablist" aria-label="캐릭터">
    <span class="lbl">layer</span>
    <button class="cbtn" role="tab" id="c-syndrome" data-char="syndrome" aria-controls="grid"><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>신드롬<sup id="n-syndrome"></sup></button>
    <span class="slash" aria-hidden="true">/</span>

/* ---------- 저장소: 비공개 GitHub 저장소 s2ndrome/zzeori-data
   방문자가 입력한 GitHub 토큰으로 GitHub API를 직접 불러요. 토큰은 그 사람 브라우저에만 남아요.
   data/state.json 에 프롬프트, images/ 에 의상 이미지를 저장하고, 저장할 때마다 커밋이 남아요. ---------- */
var GH={owner:'s2ndrome',repo:'zzeori-data',file:'data/state.json',token:'',sha:null};
var TKEY='rom-gh-token';
function b64e(str){return btoa(unescape(encodeURIComponent(str)));}
function b64d(b){return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));}
function gh(path,opt){opt=opt||{};var h={'Authorization':'Bearer '+GH.token,'Accept':opt.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});}
function ghErr(r){var e=new Error(r.status===401?'auth':r.status===403?'perm':r.status===404?'notfound':(r.status===409||r.status===422)?'conflict':'net');e.status=r.status;return e;}
var Store={
  gh:false,
  login:function(token){GH.token=token;
    return gh('/contents/'+GH.file).then(function(r){
      if(r.ok)return r.json().then(function(j){GH.sha=j.sha;Store.gh=true;return JSON.parse(b64d(j.content));});
      if(r.status===404)return gh('').then(function(r2){if(!r2.ok)throw ghErr(r2.status===404?{status:401}:r2);GH.sha=null;Store.gh=true;return null;});
      throw ghErr(r.status===404?{status:401}:r);
    });
  },
  reload:function(){return Store.login(GH.token);},
  save:function(st,msg){
    if(!Store.gh)return Promise.resolve();
    var body={message:'R♡M: '+(msg||'저장'),content:b64e(JSON.stringify(st,null,2)+'\n')};if(GH.sha)body.sha=GH.sha;
    return gh('/contents/'+GH.file,{method:'PUT',body:body}).then(function(r){if(!r.ok)throw ghErr(r);return r.json();}).then(function(j){GH.sha=j.content.sha;});
  },
  putImage:function(dataUrl){
    if(!Store.gh)return Promise.resolve(dataUrl);
    var ext=/^data:image\/png/.test(dataUrl)?'.png':'.jpg';
    var path='images/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+ext;
    return gh('/contents/'+path,{method:'PUT',body:{message:'R♡M: 이미지 추가',content:dataUrl.split(',')[1]}}).then(function(r){if(!r.ok)throw ghErr(r);return 'gh:'+path;});
  },
  dropImage:function(ref){if(!Store.gh||!ref||ref.indexOf('gh:')!==0)return;var path=ref.slice(3);
    gh('/contents/'+path).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j)gh('/contents/'+path,{method:'DELETE',body:{message:'R♡M: 이미지 삭제',sha:j.sha}});}).catch(function(){});}
};
/* 비공개 저장소 이미지는 주소만으로 열리지 않아서 토큰으로 받아와 붙인다 */
/* 이미지 파일 이름은 올릴 때마다 새로 정해져서 내용이 바뀌지 않으므로, 한 번 받은 이미지는 이 기기(Cache Storage)에 저장해 두고 다음부터 바로 쓴다.
   '나가기'를 누르면 이 저장분도 지운다. */
var IMG_CACHE='rom-img-v1',imgCache={};
function cacheKey(p){return location.origin+'/__rom-img/'+p;}
function openCache(){try{return window.caches?caches.open(IMG_CACHE):Promise.reject();}catch(e){return Promise.reject(e);}}
function loadImg(p){
  if(imgCache[p])return imgCache[p];
  imgCache[p]=openCache().then(function(c){return c.match(cacheKey(p)).then(function(hit){if(!hit)throw 0;return hit.blob();});})
    .catch(function(){return gh('/contents/'+p,{accept:'application/vnd.github.raw'}).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
      var type=/\.png$/i.test(p)?'image/png':'image/jpeg';b=b.type===type?b:new Blob([b],{type:type});
      openCache().then(function(c){return c.put(cacheKey(p),new Response(b,{headers:{'Content-Type':type}}));}).catch(function(){});return b;});})
    .then(function(b){return URL.createObjectURL(b);}).catch(function(){delete imgCache[p];return '';});
  return imgCache[p];}
function hydrate(root){(root||document).querySelectorAll('img[data-gh]').forEach(function(im){var p=im.getAttribute('data-gh');im.removeAttribute('data-gh');
  loadImg(p).then(function(u){if(!u)return;im.onload=function(){im.classList.remove('ld');var a=im.closest('.loading');if(a)a.classList.remove('loading');};im.src=u;});});}

  var q=ps.slice();function next(){var p=q.shift();if(!p)return;loadImg(p).then(next,next);}for(var k=0;k<4;k++)next();}
function clearImgCache(){imgCache={};try{if(window.caches)caches.delete(IMG_CACHE);}catch(e){}}

/* 불러오는 동안 쓰는 투명한 1x1 이미지 (깨진 이미지 아이콘이 뜨지 않게) */
var BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

function errMsg(e){var m=e&&e.message;return m==='perm'?'이 토큰은 보기 전용이라 저장할 수 없어요.':m==='auth'?'토큰이 만료됐거나 삭제됐어요. 다시 입장해 주세요.':m==='conflict'?'다른 사람이 먼저 저장했어요. 최신 내용을 불러왔으니 다시 해 주세요.':'저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';}
/* 마지막으로 불러온 내용을 이 기기에 기억 → 다음 방문 때 바로 보여주고, 뒤에서 GitHub 최신 내용으로 바꾼다 */
var SKEY='rom-state';
function cacheState(){try{localStorage.setItem(SKEY,JSON.stringify(state));}catch(e){}}
function cachedState(){try{var s=JSON.parse(localStorage.getItem(SKEY)||'null');return s&&s.items?s:null;}catch(e){return null;}}
var syncing=false;
function persist(msg){
  if(syncing){toast('최신 내용을 불러오는 중이에요. 잠시 후 다시 해 주세요.');return Promise.resolve(false);}
  return Store.save(state,msg).then(function(){render();if(Store.gh)cacheState();if(msg)toast(msg);return true;},function(e){toast(errMsg(e));
  if(e&&e.message==='conflict')Store.reload().then(function(s){if(s)state=s;render();}).catch(function(){});
  if(e&&e.message==='auth')logout();return false;});}

function render(){
  document.getElementById('mains').innerHTML=state.mains.map(function(m){var open=!!uniOpen[m.id];return ''+
    '<div class="doc"><div class="tab"><b>'+esc(m.title)+'</b></div>'+
    '<div class="sel" id="box-'+m.id+'">'+H4+'<i class="h tm"></i><i class="h bm"></i><p class="prompt">'+esc(m.prompt)+'</p>'+
    (open?'<p class="prompt u">'+esc(m.uniform||'(아직 제복 프롬프트가 없어요. 수정에서 넣어 주세요.)')+'</p>':'')+'</div>'+
    '<div class="tb"><span class="box">Mono</span><span class="box">14</span><b>B</b><i>i</i><span>A</span><button class="btn tg2" data-uni="'+m.id+'" aria-pressed="'+open+'" aria-controls="box-'+m.id+'">제복</button>'+
    (open?'<button class="btn w" data-copy="uni:'+m.id+'">COPY</button><button class="btn" data-copy="full:'+m.id+'">FULL COPY</button>':'<button class="btn" data-copy="main:'+m.id+'">'+m.label+' 복사하기</button>')+
    '<button class="btn w" data-edit="'+m.id+'">수정</button></div></div>';}).join('');
  var n={syndrome:0,ria:0};state.items.forEach(function(i){n[i.char]=(n[i.char]||0)+1;});
  document.getElementById('n-syndrome').textContent=n.syndrome;document.getElementById('n-ria').textContent=n.ria;
  var pts=state.portraits||{};
  document.getElementById('portraits').innerHTML=['syndrome','ria'].map(function(c){var src=pts[c];return '<div class="pt'+(c===cur?' on':'')+'">'+
    '<button class="pick" data-'+(src?'char':'portrait')+'="'+c+'" aria-label="'+CHARS[c]+(src?' 의상 보기':' 대표 이미지 넣기')+'"><div class="frame'+(src&&src.indexOf('gh:')===0?' loading':'')+'">'+(src?imgTag({img:src},CHARS[c]):'<span class="empty2"><b>+</b>대표 이미지<br>넣기</span>')+'</div>'+H4+'</button>'+
    (src?'<button class="ed" data-portrait="'+c+'" aria-label="'+CHARS[c]+' 대표 이미지 바꾸기">변경</button>':'')+

    (list.length?'':'<p class="empty">아직 '+CHARS[cur]+' 의상이 없어요. + 칸에서 첫 의상을 추가해 보세요.</p>')+
    '<button class="addt" data-add="'+cur+'"><b>+</b>'+CHARS[cur]+' 의상 추가</button>';
  document.querySelectorAll('.cbtn').forEach(function(b){var on=b.dataset.char===cur;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
  document.getElementById('grid').setAttribute('aria-labelledby','c-'+cur);

}

/* ---------- 복사 ---------- */
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},1800);}
function copy(text,btn){
  function ok(){toast('프롬프트를 복사했어요');if(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');}}
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var d=false;try{d=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(d)ok();else toast('복사가 막혀 있어요. 글자를 길게 눌러 직접 복사해 주세요.');}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();
}

document.addEventListener('change',function(e){var c=e.target.closest&&e.target.closest('[data-pick]');if(!c)return;

function rowHtml(s){return '<div class="srow"><div class="top2"><input type="text" class="s-label" maxlength="20" placeholder="섹션 이름 (예: 상반신만)" aria-label="섹션 이름" value="'+esc(s.label)+'"><button type="button" class="rm" data-rmrow aria-label="이 섹션 지우기">×</button></div><textarea class="s-prompt" aria-label="섹션 프롬프트" placeholder="이 섹션에서 복사할 프롬프트">'+esc(s.prompt)+'</textarea></div>';}
var pending=null;
function openPortrait(c){pending=null;var cur2=(state.portraits||{})[c];
  openSheet(c+'.png — 대표 이미지','<form class="form" id="pf" novalidate><h3 id="sheet-title" style="margin:0;font-size:20px">'+CHARS[c]+' 대표 이미지</h3>'+
  '<div class="drop"><div class="pv" id="a-pv">'+(cur2?imgTag({img:cur2},''):'미리보기')+'</div><div><input type="file" id="a-img" accept="image/*" aria-label="대표 이미지 파일"><p class="hint"><b>사진을 복사해서 Ctrl+V</b>로 붙여 넣거나, 이 칸에 끌어다 놓아도 돼요. 투명 배경도 그대로 저장돼요.</p></div></div>'+
  '<p class="err" id="a-err" role="alert"></p><div class="row-end">'+(cur2?'<button type="button" class="btn del" id="p-del">이미지 빼기</button>':'')+'<button type="button" class="btn w" data-close>취소</button><button type="submit" class="btn" id="a-save">저장하기</button></div></form>');
  var f=document.getElementById('pf');bindDrop(f);
  var del=document.getElementById('p-del');if(del)del.addEventListener('click',function(){var old=state.portraits[c];delete state.portraits[c];
    persist(CHARS[c]+' 대표 이미지를 뺐어요').then(function(ok){if(ok){Store.dropImage(old);closeSheet();}else state.portraits[c]=old;});});
  f.addEventListener('submit',function(e){e.preventDefault();var err=document.getElementById('a-err');if(!pending){err.textContent='이미지를 골라 주세요.';return;}
    var btn=document.getElementById('a-save');btn.disabled=true;btn.textContent='저장 중…';
    Store.putImage(pending).then(function(url){state.portraits=state.portraits||{};var old=state.portraits[c];state.portraits[c]=url;
      return persist(CHARS[c]+' 대표 이미지를 저장했어요').then(function(ok){if(ok){Store.dropImage(old);closeSheet();}else{state.portraits[c]=old;render();btn.disabled=false;btn.textContent='저장하기';}});
    },function(e2){err.textContent=e2&&e2.message==='perm'?'이 토큰은 보기 전용이라 저장할 수 없어요.':'이미지를 올리지 못했어요. 다시 시도해 주세요.';btn.disabled=false;btn.textContent='저장하기';});});
}
function bindDrop(f){f.addEventListener('change',function(e){if(e.target.id==='a-img'&&e.target.files[0])readImg(e.target.files[0]);});
  var drop=f.querySelector('.drop');
  drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',function(){drop.classList.remove('over');});
  drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('over');var fl=[].slice.call(e.dataTransfer.files||[]).filter(function(x){return /^image\//.test(x.type);})[0];if(fl)readImg(fl);});}
function openItemForm(ch,id){pending=null;var it=id?find(id):null;ch=it?it.char:(CHARS[ch]?ch:cur);
  var secs=it?it.sections:[{label:'전체',prompt:''},{label:'상반신만',prompt:''},{label:'신발없이',prompt:''}];
  var tags=['SET','OUTER','TOP','BOTTOM','DRESS','SHOES','BAG','ETC'];
  openSheet(it?'edit_file.png':'new_file.png','<form class="form" id="af" novalidate><h3 id="sheet-title" style="margin:0;font-size:20px">'+(it?'의상 수정':'의상 프롬프트 추가')+'</h3>'+
  '<div class="seg" role="radiogroup" aria-label="캐릭터"><label><input type="radio" name="ch" id="a-syndrome" value="syndrome"'+(ch==='syndrome'?' checked':'')+'>신드롬</label><label><input type="radio" name="ch" id="a-ria" value="ria"'+(ch==='ria'?' checked':'')+'>리아</label></div>'+
  '<div class="two"><label for="a-title">의상 이름<input type="text" id="a-title" maxlength="40" placeholder="예: 체크 플리츠 스커트" value="'+esc(it?it.title:'')+'"></label><label for="a-tag">분류<select id="a-tag">'+tags.map(function(t){return '<option'+((it?it.tag:'SET')===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label></div>'+
  '<div><label>프롬프트 섹션 <span class="hint" style="margin:0">비워 둔 섹션은 저장되지 않아요.</span></label><div class="srows" id="srows" style="margin-top:8px">'+secs.map(rowHtml).join('')+'</div><button type="button" class="btn w addsec" id="addsec" style="margin-top:10px">+ 섹션 추가</button></div>'+
  '<div><label for="a-img">의상 이미지'+(it?' (바꿀 때만 선택)':'')+'</label><div class="drop" style="margin-top:6px"><div class="pv" id="a-pv">'+(it?imgTag(it,''):'미리보기')+'</div><div><input type="file" id="a-img" accept="image/*"><p class="hint"><b>사진을 복사해서 Ctrl+V</b>로 붙여 넣거나, 이 칸에 끌어다 놓아도 돼요. 사진은 자동으로 줄여서 저장해요.</p></div></div></div>'+
  '<p class="err" id="a-err" role="alert"></p><div class="row-end"><button type="button" class="btn w" data-close>취소</button><button type="submit" class="btn" id="a-save">저장하기</button></div></form>');
  var f=document.getElementById('af');
  document.getElementById('addsec').addEventListener('click',function(){document.getElementById('srows').insertAdjacentHTML('beforeend',rowHtml({label:'',prompt:''}));var l=document.querySelectorAll('#srows .s-label');l[l.length-1].focus();});
  f.addEventListener('click',function(e){var b=e.target.closest('[data-rmrow]');if(b)b.closest('.srow').remove();});
  bindDrop(f);
  f.addEventListener('submit',function(e){e.preventDefault();
    var c=f.querySelector('input[name=ch]:checked').value,t=document.getElementById('a-title').value.trim(),err=document.getElementById('a-err');
    var rows=[].slice.call(document.querySelectorAll('#srows .srow')).map(function(r){return {label:r.querySelector('.s-label').value.trim(),prompt:r.querySelector('.s-prompt').value.trim()};}).filter(function(s){return s.prompt;});
    rows.forEach(function(s,i){if(!s.label)s.label=i?'섹션 '+(i+1):'전체';});
    if(!t){err.textContent='의상 이름을 적어 주세요.';return;}
    if(!rows.length){err.textContent='프롬프트를 한 개 이상 적어 주세요.';return;}
    if(!it&&!pending){err.textContent='의상 이미지를 골라 주세요.';return;}
    var btn=document.getElementById('a-save');btn.disabled=true;btn.textContent='저장 중…';
    (pending?Store.putImage(pending):Promise.resolve(null)).then(function(url){
      var prev=it?clone(it):null;
      if(it){if(url){Store.dropImage(it.img);it.img=url;}it.char=c;it.title=t;it.tag=document.getElementById('a-tag').value;it.sections=rows;}
      else state.items.push({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),char:c,title:t,tag:document.getElementById('a-tag').value,img:url,sections:rows});
      return persist(it?'수정했어요':CHARS[c]+' 의상을 추가했어요').then(function(ok){if(ok){cur=c;render();closeSheet();}else{if(it)Object.assign(it,prev);else state.items.pop();render();btn.disabled=false;btn.textContent='저장하기';}});
    },function(e2){err.textContent=e2&&e2.message==='perm'?'이 토큰은 보기 전용이라 저장할 수 없어요.':'이미지를 올리지 못했어요. 다시 시도해 주세요.';btn.disabled=false;btn.textContent='저장하기';});
  });
}
/* 폼이 열려 있을 때 클립보드 사진 붙여넣기 */
document.addEventListener('paste',function(e){if(ov.hidden||!document.getElementById('a-pv'))return;
  var items=[].slice.call((e.clipboardData&&e.clipboardData.items)||[]),it=items.filter(function(x){return x.kind==='file'&&/^image\//.test(x.type);})[0];
  if(!it)return;e.preventDefault();var fl=it.getAsFile();if(fl){readImg(fl);toast('붙여 넣은 사진을 넣었어요');}});
function readImg(file){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
  /* 투명한 픽셀이 있으면 PNG로 저장(JPG는 투명이 검게 변함), 없으면 용량이 작은 JPG */
  var px=g.getImageData(0,0,c.width,c.height).data,alpha=false;for(var i=3;i<px.length;i+=16){if(px[i]<255){alpha=true;break;}}
  pending=alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85);document.getElementById('a-pv').innerHTML='<img src="'+pending+'" alt="선택한 이미지">';};im.src=r.result;};r.readAsDataURL(file);}

/* 삭제는 팝업 안에서 한 번 더 확인 */
function askDelete(id){var it=find(id);var a=sheet.querySelector('.act');a.innerHTML='<span style="font-size:13px;align-self:center;font-family:var(--kr)">‘'+esc(it.title)+'’을(를) 지울까요?</span><button class="btn del" data-delyes="'+esc(id)+'">지우기</button><button class="btn w" data-open="'+esc(id)+'">취소</button>';a.querySelector('.del').focus();}

/* ---------- 순서 바꾸기 (window 화면) ---------- */
var orderTimer=null,orderBefore=null;
function saveOrderSoon(){clearTimeout(orderTimer);orderTimer=setTimeout(function(){var snap=orderBefore;orderBefore=null;
  persist('순서를 저장했어요').then(function(ok){if(!ok&&snap){state.items=snap;render();}});},900);}
function markOrder(){if(!orderBefore)orderBefore=state.items.slice();}
function moveBy(id,dir){var list=state.items.filter(function(i){return i.char===cur;}),k=list.findIndex(function(i){return i.id===id;}),o=list[k+dir];if(!o)return;
  markOrder();var a=state.items.indexOf(list[k]),b=state.items.indexOf(o);state.items[a]=o;state.items[b]=list[k];render();
  var f=document.querySelector('[data-mvid="'+id+'"][data-mv="'+dir+'"]');if(f&&!f.disabled)f.focus();else{f=document.querySelector('[data-mvid="'+id+'"]:not(:disabled)');if(f)f.focus();}
  saveOrderSoon();}
function moveTo(id,targetId,after){if(id===targetId)return;var it=find(id);markOrder();state.items.splice(state.items.indexOf(it),1);
  var t=state.items.indexOf(find(targetId));state.items.splice(after?t+1:t,0,it);render();saveOrderSoon();}
var dragId=null;
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.card[data-id]');if(!c||document.body.classList.contains('mode-view')){if(c)e.preventDefault();return;}
  dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;document.querySelectorAll('.card').forEach(function(c){c.classList.remove('dragging','drop-l','drop-r');});});
document.addEventListener('dragover',function(e){if(!dragId)return;var c=e.target.closest&&e.target.closest('.card[data-id]');if(!c)return;e.preventDefault();
  var r=c.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;document.querySelectorAll('.card').forEach(function(x){if(x!==c)x.classList.remove('drop-l','drop-r');});
  c.classList.toggle('drop-r',after);c.classList.toggle('drop-l',!after);});
document.addEventListener('drop',function(e){if(!dragId)return;var c=e.target.closest&&e.target.closest('.card[data-id]');if(!c)return;e.preventDefault();
  var after=c.classList.contains('drop-r');var id=dragId;dragId=null;moveTo(id,c.dataset.id,after);});

document.addEventListener('click',function(e){
  if(e.target===ov){closeSheet();return;}
  var mvb=e.target.closest('[data-mv]');if(mvb){if(!mvb.disabled)moveBy(mvb.dataset.mvid,+mvb.dataset.mv);return;}
  var t=e.target.closest('[data-copy],[data-open],[data-add],[data-close],[data-del],[data-delyes],[data-edit],[data-editi],[data-char],[data-uni],[data-portrait]');if(!t)return;
  var d=t.dataset;
  if(d.portrait){openPortrait(d.portrait);return;}
  if(d.char){cur=d.char;try{history.replaceState(null,'','#'+cur);}catch(x){}render();return;}
  if(d.uni){uniOpen[d.uni]=!uniOpen[d.uni];render();var b=document.querySelector('[data-uni="'+d.uni+'"]');if(b)b.focus();return;}
  if(d.copy){var k=d.copy.split(':'),txt='';
    if(k[0]==='main')txt=main(k[1]).prompt;else if(k[0]==='uni')txt=main(k[1]).uniform||'';else if(k[0]==='full'){var mm=main(k[1]);txt=joinP(mm.prompt,mm.uniform);}
    else if(k[0]==='sec'||k[0]==='fullsec'){var it=find(k[1]),sc=(it.sections[secPick]||it.sections[0]).prompt;txt=k[0]==='sec'?sc:joinP((main(CHAR_MAIN[it.char])||{}).prompt,sc);}
    if(txt)copy(txt,t);else toast('복사할 내용이 없어요');}
  else if(d.open)openItem(d.open);
  else if(d.edit)openEdit(d.edit);
  else if(d.editi)openItemForm(null,d.editi);
  else if(d.add!==undefined)openItemForm(d.add);
  else if(d.close!==undefined)closeSheet();
  else if(d.del)askDelete(d.del);
  else if(d.delyes){var id=d.delyes,gone=find(id),idx=state.items.indexOf(gone);state.items.splice(idx,1);
    persist('삭제했어요').then(function(ok){if(ok){Store.dropImage(gone.img);closeSheet();}else{state.items.splice(idx,0,gone);render();}});}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!ov.hidden)closeSheet();
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&document.activeElement&&document.activeElement.classList.contains('cbtn')){e.preventDefault();cur=cur==='syndrome'?'ria':'syndrome';render();document.getElementById('c-'+cur).focus();}
});
function fromHash(){var h=location.hash.slice(1);if(CHARS[h]){cur=h;render();}}

/* ---------- 입장: GitHub 토큰 ---------- */
var gate=document.getElementById('gate'),gform=document.getElementById('gform'),app=document.getElementById('app');
function getTok(){try{return localStorage.getItem(TKEY)||sessionStorage.getItem(TKEY)||'';}catch(e){return '';}}
function setTok(t,keep){try{localStorage.removeItem(TKEY);sessionStorage.removeItem(TKEY);if(t)(keep?localStorage:sessionStorage).setItem(TKEY,t);}catch(e){}}
function showGate(msg){gate.hidden=false;app.inert=true;document.getElementById('gerr').textContent=msg||'';setTimeout(function(){document.getElementById('gtoken').focus();},50);}
var boot=document.getElementById('boot');
function emptyState(){return {v:2,mains:clone(BASE.mains),items:[],portraits:{}};}
function enter(s){state=s;boot.hidden=true;gate.hidden=true;app.inert=false;render();fromHash();if(Store.gh){cacheState();prefetchAll();}}
function logout(){setTok('');Store.gh=false;GH.token='';GH.sha=null;clearImgCache();try{localStorage.removeItem(SKEY);}catch(e){}state=clone(BASE);document.getElementById('gtoken').value='';boot.hidden=true;showGate('');}
function tryLogin(t,keep){var btn=gform.querySelector('button');btn.disabled=true;btn.textContent='확인 중…';
  syncing=true;
  return Store.login(t).then(function(s){syncing=false;setTok(t,keep);btn.disabled=false;btn.textContent='입장';enter(s||emptyState());},
    function(e){syncing=false;btn.disabled=false;btn.textContent='입장';boot.hidden=true;
      if(e&&e.message==='auth'){setTok('');try{localStorage.removeItem(SKEY);}catch(x){}}
      else if(cachedState()&&getTok()){Store.gh=false;toast('GitHub에 연결하지 못해서 마지막으로 본 내용을 보여주고 있어요. 수정하려면 새로고침해 주세요.');return;}
      showGate(e&&e.message==='auth'?'토큰이 맞지 않거나 zzeori-data 저장소 권한이 없어요.':'GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
      gform.classList.remove('shake');void gform.offsetWidth;gform.classList.add('shake');});}
gform.addEventListener('submit',function(e){e.preventDefault();var t=document.getElementById('gtoken').value.trim();
  if(!t){showGate('토큰을 입력해 주세요.');return;}tryLogin(t,document.getElementById('gkeep').checked);});
document.getElementById('lock').addEventListener('click',function(e){e.preventDefault();logout();});
var demo=document.getElementById('gdemo');
if(/(^|\.)64bit\.kr$|github\.io$/.test(location.hostname))demo.hidden=true;
demo.addEventListener('click',function(){enter(clone(BASE));toast('예시 화면이에요. 저장해도 이 브라우저 밖으로 나가지 않아요.');});

/* view / window 전환 (이 기기에서 기억) */
function setMode(m){document.body.classList.toggle('mode-view',m==='view');
  document.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===m);});
  try{localStorage.setItem('rom-mode',m);}catch(e){}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(b){setMode(b.dataset.mode);if(!ov.hidden&&b.dataset.mode==='view'&&document.querySelector('#af,#pf,#ef'))closeSheet();}});
setMode((function(){try{return localStorage.getItem('rom-mode');}catch(e){return null;}})()==='window'?'window':'view');

var saved=getTok();
if(saved){GH.token=saved;var cs=cachedState();
  if(cs){state=cs;gate.hidden=true;app.inert=false;render();fromHash();}   /* 기억해 둔 내용을 바로 표시 */
  else{boot.hidden=false;app.inert=true;}                                   /* 처음이면 '불러오는 중' */
