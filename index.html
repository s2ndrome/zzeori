<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>쩌리 프롬프트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 그래픽 툴 화면 같은 한 장짜리 페이지.
   위: 메뉴 바 → 기본 룩북 세팅(남캐·여캐, 제복 단락 포함) 텍스트 박스 두 개 + 큰 PROMPT 타이포
   가운데: 캐릭터 섹션 버튼(신드롬 / 리아)
   아래: 선택한 캐릭터의 의상 그리드 → 누르면 프롬프트 팝업
   흑백 하프톤 톤으로 고정한 단일 밝은 테마. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111111; --ink2:#3b3b3b; --mute:#7a7a7a; --line:#111111; --soft:#f1f1ef; --err:#a12a2a;
  --grot:"Archivo","Helvetica Neue",Arial,"Noto Sans KR",sans-serif;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Noto Sans KR",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--grot);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;position:relative}

/* 핸들 */
.h{position:absolute;width:11px;height:11px;background:var(--bg);border:1px solid var(--line);pointer-events:none}
.h.tl{top:-6px;left:-6px}.h.tr{top:-6px;right:-6px}.h.bl{bottom:-6px;left:-6px}.h.br{bottom:-6px;right:-6px}.h.tm{top:-6px;left:calc(50% - 6px)}.h.bm{bottom:-6px;left:calc(50% - 6px)}

/* 메뉴 바 */
.menu{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;padding-block:20px 0}
.menu ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
.menu li.on{background:var(--ink);color:var(--bg);padding:0 4px}
.bars{display:flex;gap:8px;align-items:center}
.bars i{display:block;height:18px;border:1px solid var(--line)}
.bars i.f{background:var(--ink)}
.bars button{border:1px solid var(--line);background:var(--bg);height:22px;padding:0 10px;font-size:12px}

.rot{writing-mode:vertical-rl;font-size:13px;position:absolute;left:-28px;top:220px}

/* 히어로 */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:36px;align-items:start}
.mains{display:flex;flex-direction:column;gap:34px}
.doc{display:flex;flex-direction:column}
.tab{display:inline-flex;align-self:flex-start;align-items:center;gap:14px;border:1px solid var(--line);border-bottom:0;padding:6px 10px;font-size:14px;background:var(--bg)}
.tab b{font-weight:600}
.tab span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.sel{position:relative;border:1px solid var(--line);padding:20px 22px}
.prompt{font-family:var(--mono);font-size:14px;line-height:1.75;margin:0;word-break:break-word;white-space:pre-wrap}
.tb{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:13px}
.tb .box{border:1px solid var(--line);padding:5px 10px}
.btn{border:1px solid var(--line);background:var(--ink);color:var(--bg);padding:7px 14px;font-size:13px}
.btn.w{background:var(--bg);color:var(--ink)}

.side{display:flex;flex-direction:column;gap:22px}
.big{font-weight:400;font-stretch:88%;font-size:clamp(72px,12vw,150px);line-height:.86;letter-spacing:-.04em;margin:0}
.big .o{position:relative;display:inline-block}
.big .o::after{content:"";position:absolute;inset:6% -2% 4%;pointer-events:none;background:
  linear-gradient(var(--ink),var(--ink)) 0 0/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 0/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 100%/8px 8px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 100%/8px 8px no-repeat}
.swatch{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.grad{width:130px;border:1px solid var(--line);padding:8px}
.grad div{aspect-ratio:1;background:linear-gradient(135deg,#fff,#111)}
.grad span{display:block;margin-top:6px;border:1px solid var(--line);font-family:var(--mono);font-size:10px;padding:1px 4px;width:70%}
.count{font-size:14px;line-height:1.35}
.count b{font-family:var(--mono);font-weight:500}

/* 섹션 버튼: 신드롬 / 리아 */
.chars{margin-top:64px;display:flex;align-items:center;gap:clamp(12px,3vw,28px);flex-wrap:wrap}
.chars .lbl{font-family:var(--mono);font-size:12px;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg)}
.cbtn{position:relative;border:1px solid transparent;background:none;padding:5px 14px 6px;font-weight:500;font-stretch:80%;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.03em;color:#b5b5b5;font-family:var(--grot)}
.cbtn:hover{color:var(--ink)}
.cbtn[aria-selected="true"]{color:var(--ink);border-color:var(--line)}
.cbtn .h{display:none}
.cbtn[aria-selected="true"] .h{display:block}
.cbtn sup{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;vertical-align:top;margin-left:6px;color:var(--mute)}
.slash{font-weight:300;font-stretch:80%;font-size:clamp(22px,3vw,30px);line-height:1;color:var(--ink)}

/* 의상 그리드 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;margin-top:30px}
.it{border:0;background:none;padding:0;text-align:left;position:relative;font-family:var(--grot)}
.it .h{display:none}
.it:hover .h,.it:focus-visible .h{display:block}
.it:focus-visible{outline:none}
.art{aspect-ratio:1;border:1px solid var(--line);background:var(--soft);position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.art.contain img{object-fit:contain;padding:10%}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 0 .9px,#fff 1.3px) 0 0/4px 4px;mix-blend-mode:lighten;pointer-events:none}
.it .nm{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:8px}
.it .nm em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.addt{border:1px dashed var(--line);background:var(--bg);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}
.addt b{font-size:42px;font-weight:300;line-height:1}
.empty{grid-column:1/-1;border:1px dashed var(--line);padding:40px 20px;text-align:center;font-size:14px;color:var(--ink2)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:56px;gap:12px;flex-wrap:wrap}
.dots{font-size:22px;letter-spacing:4px}

@media (max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rot{display:none}.side{flex-direction:row;align-items:flex-end;flex-wrap:wrap}}
@media (max-width:420px){.menu ul{gap:14px}.grid{gap:18px 14px}}

/* 팝업 */
.ov{position:fixed;inset:0;z-index:40;background:rgba(17,17,17,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:min(860px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);position:relative;box-shadow:8px 8px 0 var(--ink)}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 8px 8px 14px;font-size:13px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet .bar span{font-family:var(--mono);font-size:12px}
.sheet .x{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1}
.view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.view .art{aspect-ratio:3/4;border:0;border-right:1px solid var(--line)}
.view .bd{padding:24px 22px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.view .tg{font-family:var(--mono);font-size:11px;border:1px solid var(--line);align-self:flex-start;padding:2px 8px}
.view h3{margin:0;font-size:26px;font-weight:500;font-stretch:88%;letter-spacing:-.01em}
.view pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13.5px;line-height:1.75;border:1px dashed var(--line);padding:14px;max-height:300px;overflow:auto}
.view .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn.del{background:var(--bg);color:var(--err);border-color:var(--err)}
.form{padding:22px;display:flex;flex-direction:column;gap:14px;font-family:var(--kr)}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.form input[type=text],.form textarea,.form select{font:inherit;font-weight:400;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:14px;border-radius:0}
.form textarea{min-height:130px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line)}
.seg label{flex:1;flex-direction:row!important;align-items:center;justify-content:center;padding:9px;cursor:pointer;position:relative}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.drop{border:1px dashed var(--line);padding:14px;display:flex;gap:14px;align-items:center}
.drop .pv{width:72px;height:96px;flex:none;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--mute);overflow:hidden}
.drop .pv img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.err{color:var(--err);font-size:13px;min-height:1em;margin:0}
.row-end{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:640px){.view{grid-template-columns:1fr}.view .art{aspect-ratio:4/3;border-right:0;border-bottom:1px solid var(--line)}.form .two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:14px;z-index:60;font-family:var(--kr)}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.06)}}

/* 제복 단락 */
.prompt+.prompt{margin-top:14px}
.prompt.u{padding-top:14px;border-top:1px dashed var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.tg2{background:var(--bg);color:var(--ink)}
/* 팝업 안 섹션별 프롬프트 */
.pbox{border:1px solid var(--line);position:relative;padding:14px}
.pbox .prompt{font-size:13.5px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vh b{font-size:15px;font-family:var(--kr)}
.vh .btns{display:flex;gap:6px}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--kr);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{width:16px;height:16px;accent-color:#111;margin:0}
/* 폼: 섹션 행 */
.srows{display:flex;flex-direction:column;gap:12px}
.srow{border:1px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.srow .top2{display:flex;gap:8px;align-items:center}
.srow .top2 input{flex:1;min-width:0}
.srow textarea{min-height:90px}
.srow .rm{border:1px solid var(--line);background:var(--bg);width:34px;height:38px;flex:none}
.addsec{align-self:flex-start}
.lk{display:inline-flex;align-items:center;border:1px solid var(--line);height:22px;padding:0 10px;font-size:12px;text-decoration:none;color:var(--ink)}
.mode{font-family:var(--mono);font-size:11px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="wrap" id="app">
  <div class="menu">
    <ul><li>filter</li><li>effect</li><li>view</li><li class="on">window</li></ul>
    <div class="bars"><i class="f" style="width:22px"></i><i style="width:clamp(60px,14vw,150px)"></i><button type="button" data-add>+ 추가</button><a class="lk" id="lock" href="/__logout" hidden>나가기</a></div>
  </div>
  <span class="rot">( prompt )</span>

  <div class="hero">
    <div class="mains" id="mains"></div>
    <div class="side">
      <h2 class="big">PRO<br><span class="o">MPT</span></h2>
      <div class="swatch"><div class="grad"><div></div><span>#111111</span></div><div class="count" id="count"></div></div>
    </div>
  </div>

  <div class="chars" role="tablist" aria-label="캐릭터">
    <span class="lbl">layer</span>
    <button class="cbtn" role="tab" id="c-syndrome" data-char="syndrome" aria-controls="grid"><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>신드롬<sup id="n-syndrome"></sup></button>
    <span class="slash" aria-hidden="true">/</span>
    <button class="cbtn" role="tab" id="c-ria" data-char="ria" aria-controls="grid"><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>리아<sup id="n-ria"></sup></button>
  </div>

  <div class="grid" id="grid" role="tabpanel"></div>

  <div class="foot"><span class="dots">•••</span><div class="bars"><i class="f" style="width:110px"></i><i style="width:clamp(80px,24vw,240px)"></i><i style="width:30px"></i></div></div>
</div>

<div class="ov" id="ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

    {id:'s3',char:'syndrome',title:'퍼 트리밍 코트',tag:'OUTER',art:'coat',sections:S3('long charcoal wool coat, faux fur collar, fur cuffs, belted waist, black turtleneck, black boots, full body,','long charcoal wool coat, faux fur collar, black turtleneck, upper body,','long charcoal wool coat, faux fur collar, belted waist, black trousers, barefoot, no shoes,')},
    {id:'s4',char:'syndrome',title:'버클 부츠',tag:'SHOES',art:'boots',sections:S3('black platform boots, multiple silver buckles, knee-high,')},
    {id:'r1',char:'ria',title:'프릴 미니스커트',tag:'BOTTOM',art:'skirt',sections:S3('white off-shoulder blouse, tiered white ruffle mini skirt, lace hem, black thighhighs, mary janes, full body,','white off-shoulder blouse, lace trim, ribbon choker, upper body,','white off-shoulder blouse, tiered white ruffle mini skirt, lace hem, black thighhighs, barefoot, no shoes,')},
    {id:'r2',char:'ria',title:'레이스 슬립 드레스',tag:'DRESS',art:'dress',sections:S3('black satin slip dress, lace trim, thin straps, grey cardigan, silver necklace, black heels, full body,','black satin slip dress, lace trim, thin straps, silver necklace, upper body,','black satin slip dress, lace trim, thin straps, grey cardigan, barefoot, no shoes,')},
    {id:'r3',char:'ria',title:'스트라이프 니트 탑',tag:'TOP',art:'stripe',sections:S3('black and white striped knit top, off-shoulder, arm warmers, low-rise denim shorts, sneakers, full body,','black and white striped knit top, off-shoulder, arm warmers, upper body,','black and white striped knit top, off-shoulder, low-rise denim shorts, barefoot, no shoes,')},
    {id:'r4',char:'ria',title:'체인 숄더백',tag:'BAG',art:'bag',sections:S3('small black leather shoulder bag, chunky silver chain strap, heart charm,')}
  ]
};
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- 저장소
   yujin.64bit.kr(Cloudflare Pages)에서는 서버(/api)에 저장해서 모두가 같은 내용을 봐요.
   서버가 없는 곳(미리보기, 파일로 열기)에서는 이 브라우저에만 저장해요. ---------- */
var LKEY='zzeori-site-v2';
var Store={
  server:false,
  init:function(){
    return fetch('/api/state',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(s){Store.server=true;return s&&s.items?s:null;})
      .catch(function(){Store.server=false;try{var s=JSON.parse(localStorage.getItem(LKEY)||'null');if(s&&s.items)return s;}catch(e){}return Store.migrate();});
  },
  migrate:function(){try{var o=JSON.parse(localStorage.getItem('zzeori-site-v1')||'null');if(o&&o.items&&o.items.length){var s=clone(BASE);o.items.forEach(function(i){if(i.user)s.items.unshift({id:i.id,char:i.char,title:i.title,tag:i.tag,img:i.img,sections:[{label:'전체',prompt:i.prompt}]});});return s;}}catch(e){}return null;},
  save:function(st){
    if(Store.server)return fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(st)}).then(function(r){if(!r.ok)throw new Error('save');});
    try{localStorage.setItem(LKEY,JSON.stringify(st));return Promise.resolve();}catch(e){return Promise.reject(new Error('quota'));}
  },
  putImage:function(dataUrl){
    if(!Store.server)return Promise.resolve(dataUrl);
    return fetch('/api/img',{method:'POST',credentials:'same-origin',headers:{'content-type':'text/plain'},body:dataUrl}).then(function(r){if(!r.ok)throw new Error('img');return r.json();}).then(function(j){return j.url;});
  },
  dropImage:function(url){if(Store.server&&url&&url.indexOf('/api/img/')===0)fetch(url,{method:'DELETE',credentials:'same-origin'}).catch(function(){});}
};
var state=clone(BASE);
var cur='syndrome',uniOpen={};

function find(id){return state.items.filter(function(i){return i.id===id;})[0];}
function main(id){return state.mains.filter(function(m){return m.id===id;})[0];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function art(it){return '<div class="art'+(it.img?'':' contain')+'"><img src="'+esc(it.img||svgUri(it.art||'jacket'))+'" alt="'+esc(it.title)+'" loading="lazy"></div>';}
var H4='<i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>';

function persist(msg){return Store.save(state).then(function(){render();if(msg)toast(msg);return true;},function(e){toast(e&&e.message==='quota'?'저장 공간이 부족해요. 더 작은 이미지를 써 주세요.':'저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');return false;});}

function render(){
  document.getElementById('mains').innerHTML=state.mains.map(function(m){var open=!!uniOpen[m.id];return ''+
    '<div class="doc"><div class="tab"><b>'+esc(m.title)+' · '+m.label+'</b><span>'+(m.id==='f'?'female':'male')+'.txt</span></div>'+
    '<div class="sel" id="box-'+m.id+'">'+H4+'<i class="h tm"></i><i class="h bm"></i><p class="prompt">'+esc(m.prompt)+'</p>'+
    (open?'<p class="prompt u">'+esc(m.uniform||'(아직 제복 프롬프트가 없어요. 수정에서 넣어 주세요.)')+'</p>':'')+'</div>'+
    '<div class="tb"><span class="box">Mono</span><span class="box">14</span><b>B</b><i>i</i><span>A</span><button class="btn tg2" data-uni="'+m.id+'" aria-pressed="'+open+'" aria-controls="box-'+m.id+'">제복</button>'+
    (open?'<button class="btn w" data-copy="uni:'+m.id+'">COPY</button><button class="btn" data-copy="full:'+m.id+'">FULL COPY</button>':'<button class="btn" data-copy="main:'+m.id+'">'+m.label+' 복사하기</button>')+
    '<button class="btn w" data-edit="'+m.id+'">수정</button></div></div>';}).join('');
  var n={syndrome:0,ria:0},files=state.mains.length;state.items.forEach(function(i){n[i.char]=(n[i.char]||0)+1;files+=(i.sections||[]).length;});
  document.getElementById('n-syndrome').textContent=n.syndrome;document.getElementById('n-ria').textContent=n.ria;
  document.getElementById('count').innerHTML='프롬프트<br><b>'+files+'</b> files<br><span class="mode">'+(Store.server?'shared':'this browser only')+'</span>';
  var list=state.items.filter(function(i){return i.char===cur;});
  document.getElementById('grid').innerHTML=list.map(function(it){return '<button class="it" data-open="'+esc(it.id)+'">'+art(it)+H4+'<span class="nm">'+esc(it.title)+'<em>'+(it.sections||[]).length+' sec · '+esc(String(it.tag).toLowerCase())+'</em></span></button>';}).join('')+
    (list.length?'':'<p class="empty">아직 '+CHARS[cur]+' 의상이 없어요. + 칸에서 첫 의상을 추가해 보세요.</p>')+
    '<button class="addt" data-add="'+cur+'"><b>+</b>'+CHARS[cur]+' 의상 추가</button>';
  document.querySelectorAll('.cbtn').forEach(function(b){var on=b.dataset.char===cur;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
  document.getElementById('grid').setAttribute('aria-labelledby','c-'+cur);
  document.getElementById('lock').hidden=!Store.server;
}

/* ---------- 복사 ---------- */
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},1800);}
function copy(text,btn){
  function ok(){toast('프롬프트를 복사했어요');if(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');}}
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var d=false;try{d=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(d)ok();else toast('복사가 막혀 있어요. 글자를 길게 눌러 직접 복사해 주세요.');}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();
}

/* ---------- 팝업 ---------- */
var ov=document.getElementById('ov'),sheet=document.getElementById('sheet'),last=null;
function openSheet(name,html){last=document.activeElement;sheet.innerHTML='<div class="bar"><span>'+name+'</span><button class="x" data-close aria-label="닫기">×</button></div>'+html;ov.hidden=false;var f=sheet.querySelector('input[type=text],textarea,.vh .btn');(f||sheet.querySelector('.x')).focus();}
function closeSheet(){ov.hidden=true;sheet.innerHTML='';if(last&&last.focus&&document.contains(last))last.focus();}
/* 신드롬 = 남캐 기본 세팅, 리아 = 여캐 기본 세팅 */
var CHAR_MAIN={syndrome:'m',ria:'f'};
var secPick=0;
function joinP(a,b){return [a,b].filter(Boolean).map(function(x){return x.trim();}).join(' ');}
function openItem(id){var it=find(id);if(!it)return;secPick=0;
  var opts=(it.sections||[]).map(function(s,i){return i?'<label for="opt-'+i+'"><input type="checkbox" id="opt-'+i+'" data-pick="'+i+'">'+esc(s.label)+'</label>':'';}).join('');
  openSheet(esc(String(it.tag).toLowerCase())+'.png — '+CHARS[it.char],'<div class="view">'+art(it)+'<div class="bd"><span class="tg">'+esc(it.tag)+' · '+CHARS[it.char]+'</span><h3 id="sheet-title">'+esc(it.title)+'</h3>'+
  '<div class="vh"><b>'+CHARS[it.char]+'</b><div class="btns"><button class="btn w" data-copy="sec:'+esc(it.id)+'">COPY</button><button class="btn" data-copy="fullsec:'+esc(it.id)+'">FULL COPY</button></div></div>'+
  '<div class="pbox" id="pbox"></div>'+(opts?'<div class="opts">'+opts+'</div>':'')+
  '<div class="act"><button class="btn w" data-editi="'+esc(it.id)+'">수정</button><button class="btn del" data-del="'+esc(it.id)+'">삭제</button><button class="btn w" data-close>닫기</button></div></div></div>');
  fillPbox(it);}
function fillPbox(it){var m=main(CHAR_MAIN[it.char]),s=it.sections[secPick]||it.sections[0];
  document.getElementById('pbox').innerHTML='<p class="prompt">'+esc(m?m.prompt:'')+'</p><p class="prompt u">'+esc(s.prompt)+'</p>';}
document.addEventListener('change',function(e){var c=e.target.closest&&e.target.closest('[data-pick]');if(!c)return;
  var i=+c.dataset.pick;secPick=c.checked?i:0;document.querySelectorAll('[data-pick]').forEach(function(x){if(x!==c)x.checked=false;});
  var id=sheet.querySelector('[data-editi]');if(id)fillPbox(find(id.dataset.editi));});

function openEdit(mid){var m=main(mid);
  openSheet((mid==='f'?'female':'male')+'.txt — 수정','<form class="form" id="ef" novalidate><h3 id="sheet-title" style="margin:0;font-size:20px">기본 룩북 세팅 · '+m.label+' 수정</h3>'+
  '<label for="e-title">제목<input type="text" id="e-title" maxlength="40" value="'+esc(m.title)+'"></label>'+
  '<label for="e-prompt">기본 프롬프트<textarea id="e-prompt">'+esc(m.prompt)+'</textarea></label>'+
  '<label for="e-uni">제복 프롬프트 <span class="hint" style="margin:0">제복 버튼을 누르면 나오는 두 번째 단락이에요.</span><textarea id="e-uni">'+esc(m.uniform)+'</textarea></label><p class="err" id="e-err" role="alert"></p>'+
  '<div class="row-end"><button type="button" class="btn w" data-close>취소</button><button type="submit" class="btn">저장하기</button></div></form>');
  document.getElementById('ef').addEventListener('submit',function(e){e.preventDefault();var t=document.getElementById('e-title').value.trim(),p=document.getElementById('e-prompt').value.trim();
    if(!t||!p){document.getElementById('e-err').textContent='제목과 기본 프롬프트를 적어 주세요.';return;}
    var prev=clone(m);m.title=t;m.prompt=p;m.uniform=document.getElementById('e-uni').value.trim();
    persist(m.label+' 세팅을 저장했어요').then(function(ok){if(ok)closeSheet();else{Object.assign(m,prev);render();}});});
}

function rowHtml(s){return '<div class="srow"><div class="top2"><input type="text" class="s-label" maxlength="20" placeholder="섹션 이름 (예: 상반신만)" aria-label="섹션 이름" value="'+esc(s.label)+'"><button type="button" class="rm" data-rmrow aria-label="이 섹션 지우기">×</button></div><textarea class="s-prompt" aria-label="섹션 프롬프트" placeholder="이 섹션에서 복사할 프롬프트">'+esc(s.prompt)+'</textarea></div>';}
var pending=null;
function openItemForm(ch,id){pending=null;var it=id?find(id):null;ch=it?it.char:(CHARS[ch]?ch:cur);
  var secs=it?it.sections:[{label:'전체',prompt:''},{label:'상반신만',prompt:''},{label:'신발없이',prompt:''}];
  var tags=['OUTER','TOP','BOTTOM','DRESS','SET','SHOES','BAG','ETC'];
  openSheet(it?'edit_file.png':'new_file.png','<form class="form" id="af" novalidate><h3 id="sheet-title" style="margin:0;font-size:20px">'+(it?'의상 수정':'의상 프롬프트 추가')+'</h3>'+
  '<div class="seg" role="radiogroup" aria-label="캐릭터"><label><input type="radio" name="ch" id="a-syndrome" value="syndrome"'+(ch==='syndrome'?' checked':'')+'>신드롬</label><label><input type="radio" name="ch" id="a-ria" value="ria"'+(ch==='ria'?' checked':'')+'>리아</label></div>'+
  '<div class="two"><label for="a-title">의상 이름<input type="text" id="a-title" maxlength="40" placeholder="예: 체크 플리츠 스커트" value="'+esc(it?it.title:'')+'"></label><label for="a-tag">분류<select id="a-tag">'+tags.map(function(t){return '<option'+(it&&it.tag===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label></div>'+
  '<div><label>프롬프트 섹션 <span class="hint" style="margin:0">비워 둔 섹션은 저장되지 않아요.</span></label><div class="srows" id="srows" style="margin-top:8px">'+secs.map(rowHtml).join('')+'</div><button type="button" class="btn w addsec" id="addsec" style="margin-top:10px">+ 섹션 추가</button></div>'+
  '<div><label for="a-img">의상 이미지'+(it?' (바꿀 때만 선택)':'')+'</label><div class="drop" style="margin-top:6px"><div class="pv" id="a-pv">'+(it?'<img src="'+esc(it.img||svgUri(it.art||'jacket'))+'" alt="">':'미리보기')+'</div><div><input type="file" id="a-img" accept="image/*"><p class="hint">사진은 자동으로 줄여서 저장해요. 흑백·망점 효과는 화면에서만 입혀져요.</p></div></div></div>'+
  '<p class="err" id="a-err" role="alert"></p><div class="row-end"><button type="button" class="btn w" data-close>취소</button><button type="submit" class="btn" id="a-save">저장하기</button></div></form>');
  var f=document.getElementById('af');
  document.getElementById('addsec').addEventListener('click',function(){document.getElementById('srows').insertAdjacentHTML('beforeend',rowHtml({label:'',prompt:''}));var l=document.querySelectorAll('#srows .s-label');l[l.length-1].focus();});
  f.addEventListener('click',function(e){var b=e.target.closest('[data-rmrow]');if(b)b.closest('.srow').remove();});
  f.addEventListener('change',function(e){if(e.target.id==='a-img'&&e.target.files[0])readImg(e.target.files[0]);});
  f.addEventListener('submit',function(e){e.preventDefault();
    var c=f.querySelector('input[name=ch]:checked').value,t=document.getElementById('a-title').value.trim(),err=document.getElementById('a-err');
    var rows=[].slice.call(document.querySelectorAll('#srows .srow')).map(function(r){return {label:r.querySelector('.s-label').value.trim(),prompt:r.querySelector('.s-prompt').value.trim()};}).filter(function(s){return s.prompt;});
    rows.forEach(function(s,i){if(!s.label)s.label=i?'섹션 '+(i+1):'전체';});
    if(!t){err.textContent='의상 이름을 적어 주세요.';return;}
    if(!rows.length){err.textContent='프롬프트를 한 개 이상 적어 주세요.';return;}
    if(!it&&!pending){err.textContent='의상 이미지를 골라 주세요.';return;}
    var btn=document.getElementById('a-save');btn.disabled=true;btn.textContent='저장 중…';
    (pending?Store.putImage(pending):Promise.resolve(null)).then(function(url){
      var prev=it?clone(it):null;
      if(it){if(url){Store.dropImage(it.img);it.img=url;}it.char=c;it.title=t;it.tag=document.getElementById('a-tag').value;it.sections=rows;}
      else state.items.unshift({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),char:c,title:t,tag:document.getElementById('a-tag').value,img:url,sections:rows});
      return persist(it?'수정했어요':CHARS[c]+' 의상을 추가했어요').then(function(ok){if(ok){cur=c;render();closeSheet();}else{if(it)Object.assign(it,prev);else state.items.shift();render();btn.disabled=false;btn.textContent='저장하기';}});
    },function(){err.textContent='이미지를 올리지 못했어요. 다시 시도해 주세요.';btn.disabled=false;btn.textContent='저장하기';});
  });
}
function readImg(file){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pending=c.toDataURL('image/jpeg',.85);document.getElementById('a-pv').innerHTML='<img src="'+pending+'" alt="선택한 이미지">';};im.src=r.result;};r.readAsDataURL(file);}

/* 삭제는 팝업 안에서 한 번 더 확인 */
function askDelete(id){var it=find(id);var a=sheet.querySelector('.act');a.innerHTML='<span style="font-size:13px;align-self:center;font-family:var(--kr)">‘'+esc(it.title)+'’을(를) 지울까요?</span><button class="btn del" data-delyes="'+esc(id)+'">지우기</button><button class="btn w" data-open="'+esc(id)+'">취소</button>';a.querySelector('.del').focus();}

document.addEventListener('click',function(e){
  if(e.target===ov){closeSheet();return;}
  var t=e.target.closest('[data-copy],[data-open],[data-add],[data-close],[data-del],[data-delyes],[data-edit],[data-editi],[data-char],[data-uni]');if(!t)return;
  var d=t.dataset;
  if(d.char){cur=d.char;try{history.replaceState(null,'','#'+cur);}catch(x){}render();return;}
  if(d.uni){uniOpen[d.uni]=!uniOpen[d.uni];render();var b=document.querySelector('[data-uni="'+d.uni+'"]');if(b)b.focus();return;}
  if(d.copy){var k=d.copy.split(':'),txt='';
    if(k[0]==='main')txt=main(k[1]).prompt;else if(k[0]==='uni')txt=main(k[1]).uniform||'';else if(k[0]==='full'){var mm=main(k[1]);txt=joinP(mm.prompt,mm.uniform);}
    else if(k[0]==='sec'||k[0]==='fullsec'){var it=find(k[1]),sc=(it.sections[secPick]||it.sections[0]).prompt;txt=k[0]==='sec'?sc:joinP((main(CHAR_MAIN[it.char])||{}).prompt,sc);}
    if(txt)copy(txt,t);else toast('복사할 내용이 없어요');}
  else if(d.open)openItem(d.open);
  else if(d.edit)openEdit(d.edit);
  else if(d.editi)openItemForm(null,d.editi);
  else if(d.add!==undefined)openItemForm(d.add);
  else if(d.close!==undefined)closeSheet();
  else if(d.del)askDelete(d.del);
  else if(d.delyes){var id=d.delyes,gone=find(id),idx=state.items.indexOf(gone);state.items.splice(idx,1);
    persist('삭제했어요').then(function(ok){if(ok){Store.dropImage(gone.img);closeSheet();}else{state.items.splice(idx,0,gone);render();}});}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!ov.hidden)closeSheet();
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&document.activeElement&&document.activeElement.classList.contains('cbtn')){e.preventDefault();cur=cur==='syndrome'?'ria':'syndrome';render();document.getElementById('c-'+cur).focus();}
});
function fromHash(){var h=location.hash.slice(1);if(CHARS[h]){cur=h;render();}}
window.addEventListener('hashchange',fromHash);

render();fromHash();
Store.init().then(function(s){if(s){state=s;}else if(Store.server){Store.save(state).catch(function(){});}render();fromHash();});

})();
</script>
